<svg width="800" height="430" viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Maistro project card</title>
<desc>Brand card for Maistro: a phone-to-invoice icon flow on a yellow panel, with wordmark, tagline, tech stack and URL on white.</desc>
<defs>
	<clipPath id="cardClip"><rect x="0" y="0" width="800" height="430" rx="20"/></clipPath>
	<marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
		<path d="M1 1L9 5L1 9Z" fill="#000000"/>
	</marker>
</defs>

<g clip-path="url(#cardClip)">
	<rect x="0" y="0" width="800" height="430" fill="#ffffff"/>
	<rect x="0" y="0" width="320" height="430" fill="#FFBE00"/>

	<g stroke="#000000" stroke-opacity="0.12" stroke-width="1.5">
		<line x1="0" y1="430" x2="320" y2="0"/>
		<line x1="0" y1="280" x2="320" y2="430"/>
		<line x1="0" y1="0" x2="180" y2="430"/>
		<line x1="140" y1="0" x2="0" y2="180"/>
		<line x1="200" y1="0" x2="320" y2="140"/>
		<line x1="0" y1="60" x2="320" y2="380"/>
	</g>

	<rect x="110" y="60" width="100" height="140" rx="16" fill="#ffffff" stroke="#000000" stroke-width="3"/>
	<rect x="120" y="78" width="80" height="90" rx="6" fill="#f4f4f4" stroke="#000000" stroke-width="1.5"/>
	<g stroke="#000000" stroke-width="4" stroke-linecap="round">
		<line x1="132" y1="100" x2="188" y2="100"/>
		<line x1="132" y1="118" x2="188" y2="118"/>
		<line x1="132" y1="136" x2="170" y2="136"/>
	</g>
	<rect x="150" y="182" width="20" height="5" rx="2.5" fill="#000000"/>

	<line x1="160" y1="206" x2="160" y2="232" stroke="#000000" stroke-width="3" marker-end="url(#arrowhead)"/>

	<rect x="105" y="240" width="110" height="150" rx="8" fill="#ffffff" stroke="#000000" stroke-width="3"/>
	<path d="M195 240 L215 240 L215 260 Z" fill="#FFBE00" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
	<g stroke="#000000" stroke-width="3.5" stroke-linecap="round">
		<line x1="120" y1="270" x2="200" y2="270"/>
		<line x1="120" y1="286" x2="200" y2="286"/>
		<line x1="120" y1="302" x2="200" y2="302"/>
		<line x1="120" y1="318" x2="170" y2="318"/>
	</g>
	<circle cx="195" cy="352" r="16" fill="#000000"/>
	<text x="195" y="358" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="18" fill="#ffffff">$</text>

	<text x="360" y="122" font-family="Montserrat, Arial, sans-serif" font-weight="500" font-size="13" fill="#777777">Full-stack web app</text>

	<text x="360" y="178" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="60" fill="#000000">Maistro</text>

	<text x="360" y="215" font-family="Montserrat, Arial, sans-serif" font-weight="500" font-size="18" fill="#000000">Estimates &amp; invoices, sent by text</text>

	<line x1="360" y1="235" x2="760" y2="235" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/>

	<g font-family="Montserrat, Arial, sans-serif" font-weight="500" font-size="13">
		<rect x="360" y="250" width="81" height="28" rx="14" fill="#f4f4f4" stroke="#000000" stroke-opacity="0.12"/>
		<text x="400.5" y="268.5" text-anchor="middle" fill="#000000">Node.js</text>

		<rect x="451" y="250" width="81" height="28" rx="14" fill="#f4f4f4" stroke="#000000" stroke-opacity="0.12"/>
		<text x="491.5" y="268.5" text-anchor="middle" fill="#000000">Express</text>

		<rect x="542" y="250" width="73" height="28" rx="14" fill="#f4f4f4" stroke="#000000" stroke-opacity="0.12"/>
		<text x="578.5" y="268.5" text-anchor="middle" fill="#000000">Stripe</text>

		<rect x="360" y="288" width="103" height="28" rx="14" fill="#f4f4f4" stroke="#000000" stroke-opacity="0.12"/>
		<text x="411.5" y="306.5" text-anchor="middle" fill="#000000">PostgreSQL</text>

		<rect x="473" y="288" width="73" height="28" rx="14" fill="#f4f4f4" stroke="#000000" stroke-opacity="0.12"/>
		<text x="509.5" y="306.5" text-anchor="middle" fill="#000000">Twilio</text>

		<rect x="556" y="288" width="73" height="28" rx="14" fill="#f4f4f4" stroke="#000000" stroke-opacity="0.12"/>
		<text x="592.5" y="306.5" text-anchor="middle" fill="#000000">OpenAI</text>
	</g>

	<text x="360" y="349" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="16" fill="#000000">soymaistro.com</text>
	<rect x="360" y="354" width="134" height="3" fill="#FFBE00"/>

	<text font-family="Montserrat, Arial, sans-serif" font-weight="400" font-size="13" fill="#555555">
		<tspan x="360" y="378">Turns a text message into a professional,</tspan>
		<tspan x="360" y="396">auto-translated estimate or invoice.</tspan>
	</text>
</g>

<rect x="0.5" y="0.5" width="799" height="429" rx="20" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="1"/>
</svg>
