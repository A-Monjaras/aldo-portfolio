<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Lead Machine: an AI-assisted lead enrichment and automated outreach pipeline built for Hidalgo Advisors, showing CSV upload flowing through an AI research agent, email verification, human review, and a drip email campaign.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#151E41" />
    </marker>
    <pattern id="dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#151E41" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#F2EEE6" />
  <rect x="900" y="0" width="300" height="230" fill="url(#dotgrid)" />
  <rect x="0" y="470" width="260" height="160" fill="url(#dotgrid)" />

  <!-- header -->
  <text x="64" y="66" font-family="'Courier New', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="3" fill="#C5A052">PROJECT CASE STUDY</text>
  <text x="64" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#151E41">Lead Machine</text>
  <text x="64" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#151E41" opacity="0.72">AI-assisted lead enrichment &amp; automated outreach for commercial real estate</text>

  <!-- brand mark -->
  <circle cx="1136" cy="88" r="34" fill="none" stroke="#151E41" stroke-width="2" />
  <polygon points="1136,74 1150,88 1136,102 1122,88" fill="#C5A052" />

  <line x1="64" y1="178" x2="1136" y2="178" stroke="#151E41" stroke-opacity="0.15" stroke-width="1" />

  <!-- pipeline: 5 stages -->
  <!-- box 1: Upload CSV -->
  <rect x="65" y="205" width="170" height="150" rx="10" fill="#FFFFFF" stroke="#151E41" stroke-width="1.5" />
  <polygon points="145,210 155,210 150,201" fill="#275E97" />
  <rect x="133" y="220" width="34" height="28" rx="2" fill="none" stroke="#275E97" stroke-width="1.6" />
  <line x1="139" y1="228" x2="161" y2="228" stroke="#275E97" stroke-width="1.3" />
  <line x1="139" y1="235" x2="161" y2="235" stroke="#275E97" stroke-width="1.3" />
  <line x1="139" y1="242" x2="155" y2="242" stroke="#275E97" stroke-width="1.3" />
  <text x="150" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#151E41">Upload CSV</text>
  <text x="150" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#151E41" opacity="0.65">CoStar export</text>

  <!-- box 2: AI Research -->
  <rect x="290" y="205" width="170" height="150" rx="10" fill="#FFFFFF" stroke="#151E41" stroke-width="1.5" />
  <circle cx="375" cy="238" r="17" fill="none" stroke="#275E97" stroke-width="1.6" />
  <polygon points="375,229 384,238 375,247 366,238" fill="#C5A052" />
  <text x="375" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#151E41">AI Research</text>
  <text x="375" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#151E41" opacity="0.65">web-search agent</text>

  <!-- box 3: Verify Email -->
  <rect x="515" y="205" width="170" height="150" rx="10" fill="#FFFFFF" stroke="#151E41" stroke-width="1.5" />
  <rect x="582" y="222" width="36" height="24" rx="2" fill="none" stroke="#275E97" stroke-width="1.6" />
  <polyline points="582,222 600,236 618,222" fill="none" stroke="#275E97" stroke-width="1.3" />
  <circle cx="613" cy="250" r="9" fill="#FFFFFF" stroke="#275E97" stroke-width="1.3" />
  <polyline points="609,250 612,253 617,247" fill="none" stroke="#275E97" stroke-width="1.6" />
  <text x="600" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#151E41">Verify Email</text>
  <text x="600" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#151E41" opacity="0.65">pattern + Bouncer</text>

  <!-- box 4: Human Review -->
  <rect x="740" y="205" width="170" height="150" rx="10" fill="#FFFFFF" stroke="#151E41" stroke-width="1.5" />
  <circle cx="825" cy="226" r="7" fill="#275E97" />
  <path d="M 812 250 Q 812 233 825 233 Q 838 233 838 250 Z" fill="#275E97" />
  <text x="825" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#151E41">Human Review</text>
  <text x="825" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#151E41" opacity="0.65">approve / reject</text>

  <!-- box 5: Drip Campaign -->
  <rect x="965" y="205" width="170" height="150" rx="10" fill="#FFFFFF" stroke="#151E41" stroke-width="1.5" />
  <rect x="1032" y="216" width="36" height="24" rx="2" fill="none" stroke="#275E97" stroke-width="1.6" />
  <polyline points="1032,216 1050,230 1068,216" fill="none" stroke="#275E97" stroke-width="1.3" />
  <circle cx="1036" cy="256" r="3" fill="#C5A052" />
  <circle cx="1050" cy="256" r="3" fill="#C5A052" />
  <circle cx="1064" cy="256" r="3" fill="#C5A052" />
  <text x="1050" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#151E41">Drip Campaign</text>
  <text x="1050" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#151E41" opacity="0.65">3 emails via SES</text>

  <!-- connectors -->
  <line x1="235" y1="280" x2="284" y2="280" stroke="#151E41" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="262" y="266" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#275E97">rows</text>

  <line x1="460" y1="280" x2="509" y2="280" stroke="#151E41" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="487" y="266" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#275E97">contact</text>

  <line x1="685" y1="280" x2="734" y2="280" stroke="#151E41" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="712" y="266" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#275E97">score</text>

  <line x1="910" y1="280" x2="959" y2="280" stroke="#151E41" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="937" y="266" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#275E97">approved</text>

  <!-- feature pills -->
  <g font-family="'Courier New', Consolas, monospace" font-size="12" fill="#151E41">
    <rect x="150" y="390" width="165" height="30" rx="15" fill="#FFFFFF" stroke="#275E97" stroke-width="1.2" />
    <text x="232.5" y="410" text-anchor="middle">Cross-job dedup</text>

    <rect x="335" y="390" width="175" height="30" rx="15" fill="#FFFFFF" stroke="#275E97" stroke-width="1.2" />
    <text x="422.5" y="410" text-anchor="middle">Cost-gated AI calls</text>

    <rect x="530" y="390" width="185" height="30" rx="15" fill="#FFFFFF" stroke="#275E97" stroke-width="1.2" />
    <text x="622.5" y="410" text-anchor="middle">CAN-SPAM compliant</text>

    <rect x="735" y="390" width="215" height="30" rx="15" fill="#FFFFFF" stroke="#275E97" stroke-width="1.2" />
    <text x="842.5" y="410" text-anchor="middle">Auto bounce suppression</text>
  </g>

  <!-- tech stack -->
  <text x="600" y="452" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#C5A052">BUILT WITH</text>

  <g font-family="'Courier New', Consolas, monospace" font-size="12" fill="#F2EEE6">
    <rect x="295" y="463" width="90" height="28" rx="14" fill="#151E41" />
    <text x="340" y="482" text-anchor="middle">Node.js</text>

    <rect x="405" y="463" width="100" height="28" rx="14" fill="#151E41" />
    <text x="455" y="482" text-anchor="middle">Express</text>

    <rect x="525" y="463" width="130" height="28" rx="14" fill="#151E41" />
    <text x="590" y="482" text-anchor="middle">PostgreSQL</text>

    <rect x="675" y="463" width="90" height="28" rx="14" fill="#151E41" />
    <text x="720" y="482" text-anchor="middle">OpenAI</text>

    <rect x="785" y="463" width="120" height="28" rx="14" fill="#151E41" />
    <text x="845" y="482" text-anchor="middle">Amazon SES</text>
  </g>

  <!-- footer -->
  <line x1="64" y1="548" x2="1136" y2="548" stroke="#151E41" stroke-opacity="0.15" stroke-width="1" />
  <text x="64" y="580" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#151E41" opacity="0.6">Hidalgo Advisors &#8212; CoStar Lead Machine</text>
  <text x="1136" y="580" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#151E41" opacity="0.6">Built by Aldo Monjaras</text>
</svg>
